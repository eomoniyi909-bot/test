<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Omoniyi Emmanuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="topbar">
  <span class="location">Africa/Nigeria</span>
  <div class="floating-nav">
    <a href="index.html" class="nav-pill">🏠</a>
    <a href="about.html" class="nav-pill">👤 About</a>
    <a href="index.html#work" class="nav-pill">📦 Work</a>
    <a href="blog.html" class="nav-pill">📰 Blog</a>
    <a href="gallery.html" class="nav-pill active">🖼️ Gallery</a>
  </div>
  <div class="topbar-right">
    <button id="theme-toggle" class="theme-toggle">🌙</button>
    <span class="topbar-name">Emmanuel</span>
  </div>
</nav>

<section class="gallery-section">
  <p class="eyebrow">🖼️ Gallery</p>
  <h1 class="simple-title">Snapshots</h1>
  <p class="simple-text">A few favorite moments and memories.</p>

  <div class="gallery-grid">
    <img src="gallery1.jpg" class="gallery-img" alt="Gallery photo 1">
    <img src="gallery2.jpg" class="gallery-img" alt="Gallery photo 2">
    <img src="gallery3.jpg" class="gallery-img" alt="Gallery photo 3">
    <img src="gallery4.jpg" class="gallery-img" alt="Gallery photo 4">
    <img src="gallery5.jpg" class="gallery-img" alt="Gallery photo 5">
    <img src="gallery6.jpg" class="gallery-img" alt="Gallery photo 6">
    <img src="gallery7.jpg" class="gallery-img" alt="Gallery photo 7">
    <img src="gallery8.jpg" class="gallery-img" alt="Gallery photo 8">
    <img src="gallery9.jpg" class="gallery-img" alt="Gallery photo 9">
    <img src="gallery10.jpg" class="gallery-img" alt="Gallery photo 10">
  </div>
</section>

<div id="lightbox" class="lightbox">
  <span id="lightbox-close" class="lightbox-close">✕</span>
  <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged view">
</div>

<footer class="footer">
  <p>&copy; 2026 / Omoniyi Emmanuel / My Learning Journey.</p>
</footer>

<script>
  const toggleBtn = document.getElementById('theme-toggle');
  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    toggleBtn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
  });

  const galleryImgs = document.querySelectorAll('.gallery-img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');

  galleryImgs.forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightbox.classList.add('active');
    });
  });

  lightboxClose.addEventListener('click', () => {
    lightbox.classList.remove('active');
  });
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) lightbox.classList.remove('active');
  });
</script>

</body>
</html>
