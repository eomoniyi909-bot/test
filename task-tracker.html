<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker | Omoniyi Emmanuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="topbar">
  <span class="location">Africa/Nigeria</span>
  <div class="floating-nav">
    <a href="index.html" class="nav-pill">🏠</a>
    <a href="about.html" class="nav-pill">👤 About</a>
    <a href="index.html#work" class="nav-pill">📦 Work</a>
    <a href="index.html#blog" class="nav-pill">📰 Blog</a>
    <a href="index.html#gallery" class="nav-pill">🖼️ Gallery</a>
  </div>
  <div class="topbar-right">
    <button id="theme-toggle" class="theme-toggle">🌙</button>
    <span class="topbar-name">Emmanuel</span>
  </div>
</nav>

<section class="project-page">
  <p class="eyebrow">// project demo</p>
  <h1 class="project-title">Task Tracker</h1>
  <p class="project-text">Add your daily tasks, mark them done, and watch the chart update live.</p>

  <div class="task-input-row">
    <input type="text" id="task-input" placeholder="Add a new task...">
    <button id="add-task" class="btn">Add</button>
  </div>

  <ul id="task-list" class="task-list"></ul>

  <div class="chart-wrap">
    <canvas id="task-chart" width="240" height="240"></canvas>
  </div>

  <a href="about.html#experience" class="back-link">← Back to Work Experience</a>
</section>

<footer class="footer">
  <p>&copy; 2026 / Omoniyi Emmanuel / My Learning Journey.</p>
</footer>

<script>
  const toggleBtn = document.getElementById('theme-toggle');
  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    toggleBtn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
  });

  const taskInput = document.getElementById('task-input');
  const addBtn = document.getElementById('add-task');
  const taskList = document.getElementById('task-list');
  let tasks = [];

  const ctx = document.getElementById('task-chart');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Completed', 'Pending'],
      datasets: [{
        data: [0, 0],
        backgroundColor: ['#a6e3a1', '#f9c74f'],
        borderColor: '#1e1e2e',
        borderWidth: 3
      }]
    },
    options: {
      plugins: {
        legend: { labels: { color: '#cdd6f4', font: { family: 'JetBrains Mono' } } }
      }
    }
  });

  function updateChart() {
    const completed = tasks.filter(t => t.done).length;
    const pending = tasks.length - completed;
    chart.data.datasets[0].data = [completed, pending];
    chart.update();
  }

  function renderTasks() {
    taskList.innerHTML = '';
    tasks.forEach((task, i) => {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');
      li.innerHTML = `
        <span class="task-text">${task.text}</span>
        <span class="task-actions">
          <button class="task-check">✓</button>
          <button class="task-delete">✕</button>
        </span>
      `;
      li.querySelector('.task-check').addEventListener('click', () => {
        tasks[i].done = !tasks[i].done;
        renderTasks();
        updateChart();
      });
      li.querySelector('.task-delete').addEventListener('click', () => {
        tasks.splice(i, 1);
        renderTasks();
        updateChart();
      });
      taskList.appendChild(li);
    });
  }

  addBtn.addEventListener('click', () => {
    if (taskInput.value.trim() === '') return;
    tasks.push({ text: taskInput.value.trim(), done: false });
    taskInput.value = '';
    renderTasks();
    updateChart();
  });

  taskInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addBtn.click();
  });

  tasks = [
    { text: 'Finish CSS assignment', done: true },
    { text: 'Read chapter 4', done: false },
    { text: 'Push code to GitHub', done: false }
  ];
  renderTasks();
  updateChart();
</script>

</body>
</html>
